name: Build Simple Live APK (arm64-v8a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter 3.38.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
          cache: true

      # 1. 先获取依赖，确保插件下载到 ~/.pub-cache
      - name: Flutter pub get
        run: flutter pub get
        working-directory: simple_live_app

      # 2. 强制 Gradle 8.14（整行覆盖，兼容 -all.zip / -bin.zip）
      - name: Force Gradle 8.14 in wrapper
        run: |
          cd simple_live_app/android
          echo "--- 修改前 gradle-wrapper.properties ---"
          cat gradle/wrapper/gradle-wrapper.properties
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip|' gradle/wrapper/gradle-wrapper.properties
          echo "--- 修改后 gradle-wrapper.properties ---"
          cat gradle/wrapper/gradle-wrapper.properties
          if ! grep -q "gradle-8.14-all.zip" gradle/wrapper/gradle-wrapper.properties; then
            echo "错误：Gradle 版本替换失败"
            exit 1
          fi

      # 3. 修改主项目 settings.gradle(.kts) 的 AGP / Kotlin 版本
      - name: Force AGP 8.11.1 and Kotlin 2.2.20 in settings.gradle
        run: |
          cd simple_live_app/android
          if [ -f settings.gradle ]; then
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/' settings.gradle
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/' settings.gradle
            echo "--- settings.gradle ---"
            cat settings.gradle
          elif [ -f settings.gradle.kts ]; then
            sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/' settings.gradle.kts
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' settings.gradle.kts
            echo "--- settings.gradle.kts ---"
            cat settings.gradle.kts
          else
            echo "错误：未找到 settings.gradle 或 settings.gradle.kts"
            exit 1
          fi

      # 4. 批量降级所有插件的 AGP classpath 到 8.11.1
      - name: Downgrade AGP classpath in all plugins
        run: |
          PUB_CACHE="$HOME/.pub-cache/hosted/pub.dev"
          echo "=== 开始批量降级 AGP 到 8.11.1 ==="
          find "$PUB_CACHE" -name "build.gradle" -type f 2>/dev/null | while read -r f; do
            if grep -qE "com\.android\.tools\.build:gradle:[0-9]" "$f"; then
              sed -i -E "s|com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+\.[0-9]+|com.android.tools.build:gradle:8.11.1|g" "$f"
              echo "已修改: $f"
            fi
          done
          echo "=== 修改完成 ==="

      # 5. 给缺 namespace 的插件补 namespace（兜底）
      - name: Patch auto_orientation_v2 namespace
        run: |
          PLUGIN_DIR="$HOME/.pub-cache/hosted/pub.dev/auto_orientation_v2-2.4.7/android"
          if [ -d "$PLUGIN_DIR" ]; then
            if ! grep -q "namespace" "$PLUGIN_DIR/build.gradle"; then
              sed -i 's/^android {/android {\n    namespace "com.rizkyghofur.autoorientation"/' "$PLUGIN_DIR/build.gradle"
              echo "已为 auto_orientation_v2 添加 namespace"
            else
              echo "auto_orientation_v2 已包含 namespace，跳过"
            fi
          else
            echo "警告：未找到 auto_orientation_v2 插件目录"
          fi

      # 6. 构建 arm64-v8a release APK
      - name: Build arm64-v8a release APK
        run: flutter build apk --release --target-platform android-arm64
        working-directory: simple_live_app

      # 7. 重命名并上传产物
      - name: Rename APK
        run: |
          mv simple_live_app/build/app/outputs/flutter-apk/app-release.apk \
             simple_live_app/build/app/outputs/flutter-apk/simple_live-arm64-v8a-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-arm64-v8a-release
          path: simple_live_app/build/app/outputs/flutter-apk/simple_live-arm64-v8a-release.apk
